name: Genki grammar chapter 4 media

# (Second run after fixing two recap lines.) Makes the audio and videos for the chapter 4 lessons, removes the stale old-numbered と and が files, rebuilds the pages and commits to this branch. Nothing is deployed from here.
on:
  push:
    branches: [genki-grammar-4]
    paths: [".github/workflows/genki-grammar-4-media.yml"]

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install edge-tts numpy
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check the course loads
        run: node -e "import('./data/courses.js').then(m=>console.log(m.courses.map(c=>c.id+':'+c.lessons.length).join(',')))"
      - name: Make the audio (this course only)
        run: node video-tools/make-audio.mjs genki-1-grammar
      - name: Make the new videos
        run: |
          node video-tools/make-videos.mjs genki-1-grammar aru-iru
          node video-tools/make-videos.mjs genki-1-grammar location-words
          node video-tools/make-videos.mjs genki-1-grammar past-noun
          node video-tools/make-videos.mjs genki-1-grammar past-verb
          node video-tools/make-videos.mjs genki-1-grammar ni-mo-de-mo
          node video-tools/make-videos.mjs genki-1-grammar duration-jikan
          node video-tools/make-videos.mjs genki-1-grammar takusan
          node video-tools/make-videos.mjs genki-1-grammar particle-to
          node video-tools/make-videos.mjs genki-1-grammar particle-ga
      - name: Remove stale files for the old numbers of と and が
        run: git rm -q --ignore-unmatch videos/genki-1-grammar/24-particle-to.mp4 videos/genki-1-grammar/24-particle-to.jpg videos/genki-1-grammar/25-particle-ga.mp4 videos/genki-1-grammar/25-particle-ga.jpg courses/genki-1-grammar/24-particle-to.html courses/genki-1-grammar/25-particle-ga.html
      - name: Rebuild the course pages
        run: node build-courses.mjs
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio videos data courses courses.html index.html
          git commit -m "Genki I Grammar chapter 4: videos, audio and pages" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_014EjoYbw5ddSSeKMRSp8i3L" || echo "Nothing to commit"
          git push
