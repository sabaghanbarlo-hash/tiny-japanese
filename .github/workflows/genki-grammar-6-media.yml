name: Genki grammar chapter 6 media

# Makes the audio and videos for the chapter 6 lessons, rebuilds the pages and commits to this branch. Nothing is deployed from here.
on:
  push:
    branches: [genki-grammar-6]
    paths: [".github/workflows/genki-grammar-6-media.yml"]

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install edge-tts numpy
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check the course loads
        run: node -e "import('./data/courses.js').then(m=>console.log(m.courses.map(c=>c.id+':'+c.lessons.length).join(',')))"
      - name: Make the audio (this course only)
        run: node video-tools/make-audio.mjs genki-1-grammar
      - name: Make the new videos
        run: |
          node video-tools/make-videos.mjs genki-1-grammar te-form-basic
          node video-tools/make-videos.mjs genki-1-grammar te-form-godan
          node video-tools/make-videos.mjs genki-1-grammar te-kudasai
          node video-tools/make-videos.mjs genki-1-grammar mashou
          node video-tools/make-videos.mjs genki-1-grammar mashouka
          node video-tools/make-videos.mjs genki-1-grammar temo-ii
          node video-tools/make-videos.mjs genki-1-grammar tewa-ikenai
          node video-tools/make-videos.mjs genki-1-grammar te-imasu
          node video-tools/make-videos.mjs genki-1-grammar te-kara
      - name: Rebuild the course pages
        run: node build-courses.mjs
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio videos data courses courses.html index.html
          git commit -m "Genki I Grammar chapter 6: videos, audio and pages" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_014EjoYbw5ddSSeKMRSp8i3L" || echo "Nothing to commit"
          git push
