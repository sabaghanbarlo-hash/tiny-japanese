name: Genki course workbook PDF

# Makes the printable workbook PDF for the "Genki I Companion" course (genki-1), links it from the
# course page, rebuilds the pages and commits the result to this branch.
# It starts when this file is pushed to the genki-course branch. Nothing is deployed from here.
on:
  push:
    branches: [genki-course]
    paths: [".github/workflows/genki-pdf.yml"]

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Link the workbook from the Genki course
        run: |
          python3 - <<'PY'
          p = "data/courses.js"
          s = open(p, encoding="utf-8").read()
          old = '    lessons: genki1Lessons'
          new = '    pdf: "/downloads/genki-1-workbook.pdf",\n    lessons: genki1Lessons'
          assert s.count(old) == 1, "genki-1 entry not found"
          assert "genki-1-workbook.pdf" not in s, "already linked"
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          PY

      - name: Make the workbook PDF
        run: |
          node video-tools/make-pdfs.mjs genki-1
          ls -l downloads/genki-1-workbook.pdf
          test "$(stat -c %s downloads/genki-1-workbook.pdf)" -gt 50000

      - name: Rebuild the course pages
        run: |
          node build-courses.mjs
          grep -q "genki-1-workbook.pdf" courses/genki-1/index.html

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads data courses courses.html index.html
          git commit -m "Add workbook PDF for Genki I Companion" || echo "Nothing to commit"
          git push
