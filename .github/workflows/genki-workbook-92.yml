name: Genki grammar workbook PDF (92 lessons)

# One-off: builds the workbook PDF for the Genki I Grammar course, removes the old Genki I Companion
# videos and workbook, rebuilds the pages and commits to this branch. Nothing is deployed from here.
on:
  push:
    branches: [genki-workbook-92]
    paths: [".github/workflows/genki-workbook-92.yml"]

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Make the workbook PDF
        run: |
          node video-tools/make-pdfs.mjs genki-1-grammar
          ls -l downloads/genki-1-grammar-workbook.pdf
          test "$(stat -c %s downloads/genki-1-grammar-workbook.pdf)" -gt 100000
      - name: Rebuild the course pages
        run: |
          node build-courses.mjs
          grep -q "genki-1-grammar-workbook.pdf" courses/genki-1-grammar/index.html
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads data courses courses.html index.html
          git commit -m "Rebuild Genki I Grammar workbook PDF with all 92 lessons" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_014EjoYbw5ddSSeKMRSp8i3L" || echo "Nothing to commit"
          git push
